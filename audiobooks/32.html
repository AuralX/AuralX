<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Anime Details</title>

    <!--  custom css file  -->
    <link rel="stylesheet" href="../css/style.css">
     
</head>
<body>
    
<!--  header section starts  -->

<header class="header">

    <section class="flex">

        <div class="logo">
           <span class="fm">Fm</span>
           <div id="menu-btn" class="fas fa-bars-staggered"></div>
           <a href="../index.html">AuralX</a>
        </div>

        <div class="search-form">
           <form action="" class="search-bar">
              <input type="search" placeholder="search anime..." id="searchBox" maxlength="100">
              <label for="searchBox" class="fas fa-search"></label>
           </form>
           <a href="../filter.html" class="fas fa-filter"></a>
        </div>
                
        <a href="../login.html" class="btn"><i class="fas fa-user"></i>login</a>

        <div id="search-toggler" class="fas fa-search"></div>
     
    </section>

</header>

<!--  header section ends  -->

<div class="side-bar">

    <nav class="navbar">

        <div id="close-btn"><i class="fas fa-angle-left"></i>close menu</div>

        <a href="../index.html">🏠 home</a>
        <a href="../all series/hot series/page-1.html">♨️ hot series</a>
        <a href="../all series/most popular/page-1.html">⚡ most popular</a>

        <div class="title">all Series</div>

        <div class="column">
            <a href="../all series/adult/page-1.html">adult</a>
            <a href="../all series/adultery/page-1.html">adultery</a>
            <a href="../all series/erotic/page-1.html">erotic</a>
            <a href="../all series/incest/page-1.html">incest</a>
            <a href="../all series/lust/page-1.html">lust</a>
            <a href="../all series/romance/page-1.html">romance</a>
        </div>

    </nav>
    
</div>

<!-- anime details section starts -->

<section class="anime-details">

    <div class="row">

        <div class="image">
            <img src="../images/img-32.jpg" alt="">
            <div class="ratings">
                <p><i class="fas fa-star"></i>
                        <i class="fas fa-star"></i>
                        <i class="fas fa-star"></i>
                        <i class="fas fa-star"></i>
                        <i class="fas fa-star-half-alt"></i><span>4.3</span></p>
            </div>
            
            <div class="buttons">
                <a href="#" class="btn" onclick="playEpisode(0)"><i class="fas fa-play"></i> Play Now</a>
            </div>
        </div>

        <div class="content">
            <h3 class="title">मेरी गर्लफ्रेंड की सहपाठी मेरे साथ सोई</h3>
            
            <div class="genere">
                <a href="../all series/incest/page-1.html">incest</a>
                <a href="../all series/adultery/page-1.html">adultery</a>
            </div>
        </div>
    </div>

    <div class="drops">
        <div class="flex">
            <p>status : <span>completed</span></p> 
            <p>type : <span>lust</span></p>
        </div>
    </div>

    <div class="drops">
        <div class="flex">
            <h1 style="padding-block:15px;">🎧 Episodes List </h1>

            <!-- Episode List -->
            <div class="chapter" data-src="../audio/#.mp3" data-index="0">Episode 1 </div> 
            

            <!-- Floating Player -->
            <div id="playerBar">
            <div class="player-top">
                <span id="epInfo">Episode 1 / 3</span>

            </div>

            <input type="range" id="seekBar" value="0">

            <div class="time-line">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <div class="controls">
                <button id="prevBtn">⏮</button>
                <button id="rew10">↺ 10</button>
                <button id="playPause">▶︎</button>
                <button id="fwd10">10 ↻</button>
                <button id="nextBtn">⏭</button>
            </div>

            <div class="speed-btn" id="speedBtn">1x</div>

            <audio id="player"></audio>
            </div>
        </div>
    </div>

</section>

<!-- anime details section ends -->


















<!-- custom js file link -->
<script src="../js/script.js"></script>
<script src="../js/player.js"></script>
</body>

</html>
